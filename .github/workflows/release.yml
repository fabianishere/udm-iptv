name: Release

on:
  push:
    tags:
      - v*

jobs:
  build:
    name: Build
    runs-on: [ubuntu-latest]
    permissions: { contents: read, id-token: write, attestations: write, artifact-metadata: write }
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: udm-iptv
          submodules: recursive
      - name: Setup Dependencies
        run: sudo apt-get install devscripts debhelper build-essential
      - name: Build Package
        working-directory: udm-iptv
        run: debuild -uc -us --lintian-opts --profile debian
      - name: Attest Packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: "udm-iptv_*.deb" }
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          if-no-files-found: error
          path: |
            *.deb
            *.build*
            *.changes
            *.dsc
  release:
    name: Publish Release
    runs-on: [ubuntu-latest]
    needs: build
    permissions: { contents: write }
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifacts
          path: build-artifacts
      - name: Format Release Name
        id: format_release
        run: |
          delimiter="$(openssl rand -hex 8)"
          {
            echo "release=${GITHUB_REF#"refs/tags/"}"
            echo "changelog<<${delimiter}"
            dpkg-parsechangelog -c 1 -l debian/changelog
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        with:
          name: udm-iptv ${{ steps.format_release.outputs.release }}
          body: ${{ steps.format_release.outputs.changelog }}
          files: build-artifacts/udm-iptv_*.deb
